name: Interactive Cache Explorer

on:
  push:
    branches: [master]
    paths:
      - "_cache-explorer/**"
      - "assets/cache-explorer/**"
      - "_pages/cache-explorer.md"
      - "_layouts/tool.liquid"
      - ".github/workflows/cache-explorer.yml"
  # Runs on every pull request, with no path filter: the `changes` job skips the real
  # work when the tool's paths are untouched, so `status` can be a required check on
  # master without hanging as pending on unrelated pull requests. `status` is the one
  # check to mark required. If the first run shows a macOS/Linux difference in the
  # built assets, the fallback is a CI job on master that commits assets/cache-explorer/.
  pull_request:

permissions:
  contents: read

concurrency:
  group: cache-explorer-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: _cache-explorer

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/$BASE_REF...HEAD" |
             grep -Eq '^(_cache-explorer/|assets/cache-explorer/|_pages/cache-explorer\.md$|_layouts/tool\.liquid$|\.github/workflows/cache-explorer\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: _cache-explorer
      - run: cargo fmt --all --check
      - name: Core has no JS or OS dependencies
        run: sh scripts/check-core-deps.sh
      - run: cargo clippy -p cache-explorer-core --all-targets --locked -- -D warnings
      - run: cargo clippy -p cache-explorer-wasm --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
      # --all-targets builds the core's tests, whose dev-dependency on the core turns
      # "golden" on for its library too. These two lint the library as it ships: the
      # core's default build, and the facade with the core's "ts" alone on wasm32.
      - name: Core library without the golden feature
        run: cargo clippy -p cache-explorer-core --lib --locked -- -D warnings
      - name: Shipped build (facade library, core with ts alone)
        run: cargo clippy -p cache-explorer-wasm --target wasm32-unknown-unknown --lib --locked -- -D warnings
      - run: cargo test -p cache-explorer-core --locked
      - name: Docs build, private items included (core)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p cache-explorer-core --no-deps --document-private-items --locked
      - name: Docs build, private items included (facade)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p cache-explorer-wasm --target wasm32-unknown-unknown --no-deps --document-private-items --locked

  web:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: _cache-explorer
      - uses: actions/setup-node@v7
        with:
          node-version-file: _cache-explorer/web/.nvmrc
          cache: npm
          cache-dependency-path: _cache-explorer/web/package-lock.json
      - run: npm ci
        working-directory: _cache-explorer/web
      - name: Facade tests in headless Chrome (fails if a suite was skipped or ran nothing)
        run: npm run test:wasm
        working-directory: _cache-explorer/web
      - name: Build
        run: npm run build
        working-directory: _cache-explorer/web
      - name: Release glue refuses hostile arguments and stays healthy
        run: npm run test:glue
        working-directory: _cache-explorer/web
      - name: Generated declarations match docs/cache_explorer.d.ts
        run: diff -u docs/cache_explorer.d.ts web/pkg/cache_explorer.d.ts
      - name: Typecheck, lint, format, token and package checks, Vitest
        run: npm run check
        working-directory: _cache-explorer/web
      - name: Committed build matches a fresh build
        working-directory: .
        run: |
          git diff --exit-code -- assets/cache-explorer
          test -z "$(git status --porcelain -- assets/cache-explorer)"
      - name: wasm size
        working-directory: .
        shell: bash   # adds -o pipefail: without it the step takes tee's status and never fails
        run: sh _cache-explorer/scripts/wasm-size.sh assets/cache-explorer/cache_explorer_bg.wasm | tee -a "$GITHUB_STEP_SUMMARY"

  status:
    if: always()
    needs: [changes, rust, web]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was not needed
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job ended with: $r" >&2; exit 1 ;; esac
          done
