name: Instruments

on:
  push:
    branches: [master]
    paths:
      - "_instruments/**"
      - "assets/cache-explorer/**"
      - "_pages/cache-explorer.md"
      - "_layouts/tool.liquid"
      - ".github/workflows/instruments.yml"
  # Runs on every pull request, with no path filter: the `changes` job skips the real
  # work when the instruments' paths are untouched, so `status` can be a required check on
  # master without hanging as pending on unrelated pull requests. `status` is the one
  # check to mark required. If the first run shows a macOS/Linux difference in the
  # built assets, the fallback is a CI job on master that commits assets/cache-explorer/.
  pull_request:

permissions:
  contents: read

concurrency:
  group: instruments-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: _instruments

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: _instruments/.nvmrc
      - id: matrix
        name: One matrix entry per instrument, from its instrument.json
        run: echo "matrix=$(node scripts/instruments.mjs matrix)" >> "$GITHUB_OUTPUT"
      - id: diff
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/$BASE_REF...HEAD" |
             grep -Eq '^(_instruments/|assets/cache-explorer/|_pages/cache-explorer\.md$|_layouts/tool\.liquid$|\.github/workflows/instruments\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: rust (${{ matrix.instrument }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: _instruments
      - run: cargo fmt --all --check
      - name: The pure crates have no JS or OS dependencies
        run: sh scripts/check-deps.sh
      - run: cargo clippy --workspace --exclude '*-wasm' --all-targets --locked -- -D warnings
      - run: cargo clippy -p ${{ matrix.facade }} --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
      # --all-targets builds the core's tests, whose dev-dependency on the core turns
      # "golden" on for its library too. These two lint the libraries as they ship: the
      # pure crates' default build, and the facade with the core's "ts" alone on wasm32.
      - name: Pure libraries without the golden feature
        run: cargo clippy --workspace --exclude '*-wasm' --lib --locked -- -D warnings
      - name: Shipped build (facade library, core with ts alone)
        run: cargo clippy -p ${{ matrix.facade }} --target wasm32-unknown-unknown --lib --locked -- -D warnings
      - run: cargo test --workspace --exclude '*-wasm' --locked
      - name: Docs build, private items included (pure crates)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --exclude '*-wasm' --no-deps --document-private-items --locked
      - name: Docs build, private items included (facade)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p ${{ matrix.facade }} --target wasm32-unknown-unknown --no-deps --document-private-items --locked

  web:
    name: web (${{ matrix.instrument }})
    needs: [changes, rust]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: _instruments
      - uses: actions/setup-node@v7
        with:
          node-version-file: _instruments/.nvmrc
          cache: npm
          cache-dependency-path: _instruments/package-lock.json
      - run: npm ci
      - name: Facade tests in headless Chrome (fails if a suite was skipped or ran nothing)
        run: node scripts/instruments.mjs run test:wasm ${{ matrix.instrument }}
      - name: Build
        run: node scripts/instruments.mjs run build ${{ matrix.instrument }}
      - name: Facade tests in Node
        run: node scripts/instruments.mjs run test:wasm:node ${{ matrix.instrument }}
      - name: Release glue refuses hostile arguments and stays healthy
        run: node scripts/instruments.mjs run test:glue ${{ matrix.instrument }}
      - name: Generated declarations match the committed copy
        run: diff -u docs/${{ matrix.out }}.d.ts web/pkg/${{ matrix.out }}.d.ts
        working-directory: _instruments/${{ matrix.instrument }}
      - name: Typecheck, lint, format, token and package checks, Vitest
        run: node scripts/instruments.mjs run check ${{ matrix.instrument }}
      - name: Committed build matches a fresh build
        working-directory: .
        env:
          ASSETS: ${{ matrix.assets }}
        run: |
          git diff --exit-code -- "$ASSETS"
          test -z "$(git status --porcelain -- "$ASSETS")"
      - name: wasm size
        shell: bash   # adds -o pipefail: without it the step takes tee's status and never fails
        run: node scripts/instruments.mjs size ${{ matrix.instrument }} | tee -a "$GITHUB_STEP_SUMMARY"

  status:
    if: always()
    needs: [changes, rust, web]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was not needed
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job ended with: $r" >&2; exit 1 ;; esac
          done
