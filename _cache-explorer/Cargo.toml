[workspace]
resolver = "2"
members = ["crates/cache-explorer-core", "crates/cache-explorer-wasm"]
# A plain `cargo build`, `cargo test` or `cargo clippy` builds the core alone, so the
# facade's `ts` feature is never unified into it. CI passes `-p` on every command.
default-members = ["crates/cache-explorer-core"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-wasm-bindgen = "0.6.5"
thiserror = "2.0.21"
miniz_oxide = "0.9.1"
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
rand_core = "0.10.1"
rand_xoshiro = "=0.8.1"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "=0.2.128"
js-sys = "0.3.105"
console_error_panic_hook = "0.1.7"
insta = "1.48.0"
proptest = "1.11.0"
wasm-bindgen-test = "0.3.78"

# Cargo ignores profiles in member manifests, so the release profile lives here.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
