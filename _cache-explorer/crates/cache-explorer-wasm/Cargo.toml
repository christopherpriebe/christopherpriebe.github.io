[package]
name = "cache-explorer-wasm"
version = "0.1.0"
description = "The WebAssembly facade of the Interactive Cache Explorer: marshalling between JavaScript and cache-explorer-core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cache-explorer-core = { path = "../cache-explorer-core", features = ["ts"] }

[dev-dependencies]
cache-explorer-core = { path = "../cache-explorer-core", features = ["golden"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false          # run the pinned binaryen from web/node_modules instead
[package.metadata.wasm-pack.profile.release.wasm-bindgen]
debug-js-glue = false
demangle-name-section = false
dwarf-debug-info = false
