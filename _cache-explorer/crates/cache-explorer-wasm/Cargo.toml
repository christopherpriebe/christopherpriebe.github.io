[package]
name = "cache-explorer-wasm"
version = "0.1.0"
description = "The WebAssembly facade of the Interactive Cache Explorer: marshalling between JavaScript and cache-explorer-core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cache-explorer-core = { path = "../cache-explorer-core", features = ["ts"] }
console_error_panic_hook = { workspace = true }   # debug builds only: the start function is cfg(debug_assertions)
js-sys = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
tsify = { workspace = true }
wasm-bindgen = { workspace = true }

[dev-dependencies]
cache-explorer-core = { path = "../cache-explorer-core", features = ["golden"] }
wasm-bindgen-test = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false          # run the pinned binaryen from web/node_modules instead
[package.metadata.wasm-pack.profile.release.wasm-bindgen]
debug-js-glue = true      # type checks on arguments and freed objects: wrong types throw instead of trapping
demangle-name-section = false
dwarf-debug-info = false
