[workspace]
resolver = "2"
members = [
    "crates/instrument-session",
    "crates/instrument-asm",
    "crates/cache-explorer-core",
    "crates/instrument-wasm",
    "crates/cache-explorer-wasm",
]
# A plain `cargo build`, `cargo test` or `cargo clippy` builds every crate but the facade, so
# its `ts` feature is never unified into them. CI passes `--workspace --exclude '*-wasm'` for
# the pure crates and `-p` for a facade.
default-members = [
    "crates/instrument-session",
    "crates/instrument-asm",
    "crates/cache-explorer-core",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }   # no "std": it adds io error code the core never uses
serde-wasm-bindgen = "0.6.5"
thiserror = "2.0.21"
miniz_oxide = "0.9.1"
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
rand_core = "0.10.1"
rand_xoshiro = "=0.8.1"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "=0.2.128"
js-sys = "0.3.105"
console_error_panic_hook = "0.1.7"
insta = "1.48.0"
proptest = "1.11.0"
wasm-bindgen-test = "0.3.78"

# Every member opts in with `[lints] workspace = true`. CI runs clippy with
# `-D warnings`, so every "warn" here is an error there.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"            # a panic poisons the wasm Session
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"       # lookups go through accessors that return Option
unwrap_in_result = "warn"
must_use_candidate = "allow"    # fires on every pure accessor; #[must_use] is added by hand where dropping a value is a bug

# Cargo ignores profiles in member manifests, so the release profile lives here.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
