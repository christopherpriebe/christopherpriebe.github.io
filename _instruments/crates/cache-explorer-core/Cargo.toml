[package]
name = "cache-explorer-core"
version = "0.1.0"
description = "The cache model of the Interactive Cache Explorer: ops, micro-events, the session log, edits, sharing and guided modules."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
ts = ["dep:tsify", "dep:wasm-bindgen", "instrument-session/ts"]
                                         # enabled only by cache-explorer-wasm; tsify's derive names wasm_bindgen by
                                         # path, so both are needed; tsify's "js" feature brings serde-wasm-bindgen
                                         # and js-sys; the shared crate's types derive their declarations too
golden = []                              # enabled only by dev-dependencies, the core's own and the facade's:
                                         # the golden fixtures and render

[dependencies]
instrument-session = { path = "../instrument-session" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rand_core = { workspace = true }
rand_xoshiro = { workspace = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
# tests/golden.rs snapshots the golden fixtures, which only the "golden" feature
# builds; depending on the crate itself turns the feature on for its own tests.
# Cargo then builds the library with it too whenever a test target is built, as
# --all-targets does, so CI also lints the library alone with --lib.
cache-explorer-core = { path = ".", features = ["golden"] }
# tests/share.rs builds and reads share strings by hand.
base64 = { workspace = true }
miniz_oxide = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }
