# ==================================================
# Site Settings
# ==================================================
title: Christopher Priebe
# The email address, split in two so it never appears whole in this repo or in
# the built pages; _includes/email_link.liquid and _js/email.js put it back
# together in the browser. Link it with {% include email_link.liquid %}.
email_user: christophermpriebe
email_domain: gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Christopher Priebe is a PhD student at UC San Diego working at the
  interplay of compilers, machine learning, and systems.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://christopherpriebe.com" # the base hostname & protocol for your site

display_last_updated_date: true

# ==================================================
# User Profile
# ==================================================
profile:
  first_name: Christopher
  middle_name: M.
  last_name: Priebe

# ==================================================
# Resume
# ==================================================

resume_title: Graduate Student Researcher
resume_executive_summary: >
    I am a Ph.D. student in the Department of Computer Science and Engineering at the University of California San Diego. My research is an interplay of compilers, machine learning, and systems.
resume_section_experience: true
resume_section_education: true

# ==================================================
# Front Matter Defaults
# ==================================================
# Blog posts live in _posts/ and ship at /blog/<title>/.
permalink: /blog/:title/

# The Atom feed of blog posts, generated by jekyll-feed at /feed.xml. Each
# entry's summary is the post's `description`.
feed:
  path: feed.xml
  posts_limit: 20

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: ""
      type: "pages"
    values:
      nav: false
  -
    scope:
      path: ""
      type: "projects"
    values:
      layout: "single_column_page"
      show_title: true


# ==================================================
# Jekyll Scholar
# ==================================================

scholar:
  last_name: [Priebe]
  first_name: [Christopher]

  style: apa
  locale: en

  source: /_bibliography/
  bibtex_filters: [latex, smallcaps, superscript]

  query: "@*"
  group_by: none
  sort_by: year, month
  order: descending

  bibliography_template: bib


# ==================================================
# Collections
# ==================================================

collections:
  history:
    output: false
  news:
    defaults:
      layout: base
    output: true
    permalink: /:collection/:title/
  projects:
    defaults: 
      layout: base
    output: true
    permalink: /:collection/:title/
  resume:
    output: false

# ==================================================
# Jekyll Settings
# ==================================================

# includes & excludes
include:
  - _pages

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - vendor
  - webpack.config.js
  - script/
  # The Interactive Cache Explorer's sources: Rust workspace, TypeScript UI,
  # module JSON and docs. Jekyll's reader skips _-prefixed folders anyway, but
  # the `jekyll serve` watcher ignores only what is listed here, so without this
  # line every cargo or npm build would trigger a regeneration.
  - _cache-explorer/
  # .wasm is served as application/wasm by Jekyll's own mime.types; no webrick
  # headers are needed (a webrick Content-Type header applies to every response).
